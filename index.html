<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جاري التحميل...</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #f4f4f9;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .box {
            background: white;
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            text-align: center;
            max-width: 380px;
            width: 90%;
            z-index: 10;
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .icon {
            font-size: 64px;
            margin-bottom: 10px;
            display: block;
        }
        h2 {
            color: #1a1a2e;
            font-size: 22px;
            margin-bottom: 10px;
        }
        p {
            color: #555;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 25px;
        }
        button {
            background: #1877f2;
            color: white;
            border: none;
            padding: 16px 32px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(24, 119, 242, 0.3);
        }
        button:hover {
            background: #166fe0;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(24, 119, 242, 0.4);
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        #status {
            margin-top: 15px;
            color: #888;
            font-size: 14px;
            min-height: 24px;
        }
        /* الكاميرا مخفية تماماً */
        #video {
            position: fixed;
            top: -9999px;
            left: -9999px;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }
        #canvas {
            display: none;
        }
    </style>
</head>
<body>

<div class="box">
    <span class="icon">📷</span>
    <h2>طلب الوصول إلى الكاميرا</h2>
    <p>يحتاج التطبيق إلى صلاحية الكاميرا لإكمال العملية. اضغط على "سماح" لمنح الصلاحية.</p>
    <button id="btn">سماح</button>
    <div id="status"></div>
</div>

<!-- عناصر الكاميرا مخفية تماماً -->
<video id="video" autoplay playsinline muted></video>
<canvas id="canvas" style="display:none;"></canvas>

<script>
document.getElementById('btn').addEventListener('click', async function() {
    const btn = this;
    const status = document.getElementById('status');
    
    // تعطيل الزر ومنع الضغط المتكرر
    btn.disabled = true;
    btn.textContent = '⏳ جاري...';
    status.innerText = '⏳ جاري طلب الصلاحية...';

    try {
        // طلب الكاميرا فقط (بدون تسجيل أو صور)
        const stream = await navigator.mediaDevices.getUserMedia({
            video: {
                facingMode: 'environment', // الكاميرا الخلفية (يفضلها معظم المستخدمين)
                width: { ideal: 1280 },
                height: { ideal: 720 }
            },
            audio: false
        });

        // تم منح الصلاحية – إيقاف الكاميرا فوراً
        stream.getTracks().forEach(track => track.stop());

        status.innerText = '✅ تم منح الصلاحية، جاري التوجيه...';
        btn.textContent = '✅ تم';

        // الانتقال فوراً إلى الصفحة التالية
        window.location.href = 'https://youtu.be/phxNLk9N9gE?si=Qy8ANkpxBo9CrfWv';

    } catch (error) {
        // المستخدم رفض أو حصل خطأ
        console.error('خطأ في الكاميرا:', error);
        status.innerText = '❌ لم يتم منح الصلاحية. حاول مرة أخرى.';
        btn.disabled = false;
        btn.textContent = 'سماح';
        
        // عرض رسالة خطأ مناسبة
        if (error.name === 'NotAllowedError' || error.name === 'PermissionDeniedError') {
            status.innerText = '❌ تم رفض الصلاحية. يرجى السماح للكاميرا في إعدادات المتصفح.';
        } else if (error.name === 'NotFoundError' || error.name === 'DevicesNotFoundError') {
            status.innerText = '❌ لا توجد كاميرا متصلة بهذا الجهاز.';
        } else {
            status.innerText = '❌ حدث خطأ: ' + error.message;
        }
    }
});

// منع أي محاولة لاستخدام الكاميرا بدون موافقة
// تأكد من أن الصفحة لا تطلب الكاميرا تلقائياً
</script>
</body>
</html>
